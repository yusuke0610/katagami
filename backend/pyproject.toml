# 依存の SSoT は本ファイルの [project.dependencies] + uv.lock。
# 追加・更新後は `cd backend && uv lock` で uv.lock を再生成してコミットすること。
# 供給網リスク（レンジ内 yank / 侵害バージョンの混入)を避けるため全依存を == で固定する。
[project]
name = "katagami-backend"
version = "0.0.0"
description = "katagami backend (FastAPI)"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.139.0",
    # starlette は fastapi の推移的依存だが、セキュリティ更新を明示制御するため固定する
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # TestClient (starlette) が要求
    "httpx==0.28.1",
    "ruff==0.15.21",
    # ミューテーションテスト（週次 CI: .github/workflows/mutation.yml）
    "mutmut==3.6.0",
]

[tool.uv]
# backend はアプリケーション（app/ レイアウト）でありパッケージとして build/install しない。
# 依存はローカル・CI とも flake.nix の uv2nix build（devshell）が提供し、uv sync は使わない。
# uv は uv.lock の更新（uv lock）と uvx / uv tool run 専用。
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# --cov は Makefile / CI 側の pytest 呼び出しで付与する（mutation テスト導入時の干渉回避）
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

# ミューテーションテスト（週次 CI: .github/workflows/mutation.yml）
# 対象は高価値な決定論的ビジネスロジックに限定する。source_paths の app 全体は
# mutants/ へコピーされる（import 解決のため）が、変異を加えるのは only_mutate の
# グロブ（fnmatch。"*" は "/" にもマッチ）に一致するファイルのみ。
# schemas / models / ルーター定義・宣言層は対象外（テストで殺せないミュータントが
# ノイズになるため）。本設定の only_mutate は TDD 対象スコープの正本でもある
# （scripts/lint-tdd.sh が参照）。
[tool.mutmut]
source_paths = ["app"]
only_mutate = [
    "app/core/errors.py",              # エラー正規化・コード推定
    "app/services/tasks/worker.py",    # タスク状態遷移
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "alembic_migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# import 解決先の Python は実行側が --pythonpath で明示する:
#   ローカル・CI とも make typecheck-backend が devshell の python3（uv2nix build）を渡す
[tool.pyright]
pythonVersion = "3.13"
include = ["app", "tests", "alembic_migrations"]
extraPaths = ["."]
