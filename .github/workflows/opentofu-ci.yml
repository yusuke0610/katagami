name: OpenTofu CI

# infra の静的検証（fmt + validate）。apply は行わない（クラウド認証情報を CI に置かない）。
# validate は init -backend=false で state 接続なしに実行する。

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-ci.yml"
      - "flake.nix"
      - "flake.lock"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # tofu も devshell から供給する（ローカルと同一バージョン / コマンドの正本は Makefile）
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock', 'web/package.json', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell
        run: nix develop --command true

      - name: Format check
        run: make infra-fmt-check

      - name: Validate (dev / stg / prod)
        run: make infra-validate
