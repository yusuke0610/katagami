name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    runs-on: ubuntu-latest
    # Nix store キャッシュミス時は node_modules（importNpmLock build）の構築に数分かかるため余裕を持たせる
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）
          persist-credentials: false

      # dev と CI のビルド経路を Nix devshell へ一致させる。
      # Node.js も node_modules（importNpmLock build）もすべて devshell が提供する
      # （setup-node / npm ci は使わない）。
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # flake inputs（nixpkgs / uv2nix 等）の GitHub 取得でレート制限に当たらないようにする
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock', 'web/package.json', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell (node_modules 込み)
        run: nix develop --command true

      - name: バージョン確認
        run: nix develop --command bash -c "node --version && npm --version"

      # package-lock.json が package.json と drift していたら fail する
      # （importNpmLock は package-lock.json を正として build するため）。
      # コマンドの正本は scripts/npm-lock.sh（make lock-web と共通）
      - name: package-lock.json の drift 検証
        run: |
          nix develop --command bash scripts/npm-lock.sh
          git diff --exit-code web/package-lock.json

      # コマンドの正本は Makefile（ローカルと CI の drift 防止）
      - name: Lint web
        run: make lint-web

      - name: Format check
        run: make format-check

      - name: Run web tests
        run: make test-web

      - name: Build web
        run: make build-web

  test-backend:
    runs-on: ubuntu-latest
    # Nix store キャッシュミス時は devshell（uv2nix build）の構築に数分かかるため余裕を持たせる
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # lint-tdd が base ブランチとの merge-base diff を必要とするため全履歴を取得する
          fetch-depth: 0
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）
          persist-credentials: false

      # 領域跨ぎの SSoT drift 検知（env 名 / ADR 索引）。
      # bash/grep/comm のみに依存するため nix 非経由で直接実行し、
      # 重い devshell 構築の前に置いて fail-fast にする。
      - name: Lint SSoT (env names)
        run: make lint-env-keys

      - name: Lint SSoT (ADR index)
        run: make lint-adr-index

      # TDD 対象（決定論的ロジック層 = mutation スコープ）の実装変更に
      # テスト差分が随伴しているかを検知。bash/git/awk/sed のみ。
      - name: Lint SSoT (TDD test accompaniment)
        run: make lint-tdd

      # dev と CI のビルド経路を Nix devshell（uv2nix build）へ一致させる。
      # Python 3.13・依存パッケージはすべて devshell が提供する。
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # flake inputs（nixpkgs / uv2nix 等）の GitHub 取得でレート制限に当たらないようにする
          github_access_token: ${{ github.token }}

      # devshell の closure（uv2nix build の Python 環境込み）を GitHub Actions cache に保存する。
      # キーは flake と uv.lock のハッシュ。ミス時は restore-prefixes-first-match で旧キャッシュから
      # 差分ビルドする。
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock', 'web/package.json', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell (uv2nix)
        run: nix develop --command true

      # uv.lock が pyproject.toml と drift していたら fail する。
      # uv2nix は uv.lock を正として build するため、drift の検知はこのステップが担う。
      - name: uv.lock の drift 検証
        run: nix develop --command bash -c "cd backend && uv lock --check"

      - name: バージョン確認
        run: nix develop --command bash -c "python3 --version && uv --version && ruff --version"

      # コマンドの正本は Makefile（ローカルと CI の drift 防止）
      - name: Lint backend
        run: make lint-backend

      - name: Typecheck backend
        run: make typecheck-backend

      - name: Run backend tests
        run: make test-backend

  # OpenAPI → TypeScript 型生成の drift 検知（型契約）。
  # backend の Pydantic / ルーター定義（正本）を変えたのに web/src/api/generated.ts を
  # 再生成し忘れた PR を止める。再生成はローカルと同一の make codegen-types を呼ぶ
  # （コマンドの SSoT は Makefile）。
  codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # 型生成のドリフト検知のみで push はしないため認証情報は保持しない
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock', 'web/package.json', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell
        run: nix develop --command true

      - name: OpenAPI → TypeScript 型を再生成
        run: make codegen-types

      - name: Check generated types drift
        run: |
          if ! git diff --exit-code web/src/api/generated.ts; then
            echo "::error::web/src/api/generated.ts が最新ではありません。'make codegen-types' を実行して再生成し、コミットしてください。"
            exit 1
          fi

  # テンプレート生成のスモーク（ADR-0002）。
  # nix run .#new で実際に生成し、置換漏れゼロ・devshell 構築・SSoT lint・テストが
  # 生成直後のリポジトリで通ることを検証する（生成物の劣化を CI で検知）。
  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock', 'web/package.json', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Generate project from template
        run: nix run .#new -- smoke-sample "$RUNNER_TEMP/smoke-sample"

      - name: Verify no template token remains
        run: |
          if grep -rIq --exclude-dir=.git "katagami" "$RUNNER_TEMP/smoke-sample"; then
            echo "::error::生成物に置換漏れがあります"
            grep -rIl --exclude-dir=.git "katagami" "$RUNNER_TEMP/smoke-sample"
            exit 1
          fi

      - name: Build generated devshell
        working-directory: ${{ runner.temp }}/smoke-sample
        run: nix develop --command true

      # 生成直後のリポジトリで SSoT lint（lint-tdd は origin 未設定 skip の経路）と
      # backend / web テストが通ることを確認する
      - name: Run gates in generated project
        working-directory: ${{ runner.temp }}/smoke-sample
        run: |
          make lint-env-keys lint-adr-index lint-tdd
          make test-backend
          make test-web

  # コード重複検知（jscpd）。導入初期は warn-only（threshold=100 / continue-on-error）。
  # baseline 取得後に閾値を絞り fail 化する予定。
  detect-duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock', 'web/package.json', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell
        run: nix develop --command true

      - name: Run jscpd
        run: make dupe-check

      - name: Upload duplication report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: jscpd-report
          path: report/dupe/
          retention-days: 14
